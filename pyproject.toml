[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blameshift"
version = "0.1.0"
description = "Find the change that broke your latency: change-point detection plus blame attribution for latency time series."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Raul Tinajero Olivas" }]
keywords = ["latency", "change-point", "performance", "observability", "regression"]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
blameshift = "blameshift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
